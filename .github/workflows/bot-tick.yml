name: Autonomous Bot Cron

on:
  schedule:
    # GitHub Actions minimum schedule frequency (every 5 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Bot Tick Engine
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          APP_URL="${{ secrets.APP_URL }}"
          BASE_URL="${APP_URL:-https://tbo.dyqanmarket.com}"
          AUTH_TOKEN="${SECRET:-c4baf1f0f9d91c4e4ddb51e10fd15ba5327196c47c5555905f728c32ebfd3804}"
          
          echo "Targeting: ${BASE_URL}/api/bot/tick"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -H "x-oracle-token: ${AUTH_TOKEN}" \
            "${BASE_URL}/api/bot/tick")
          
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Bot tick failed with HTTP status $STATUS."
            if echo "$RESPONSE" | grep -q "DEPLOYMENT_NOT_FOUND"; then
              echo "::error::Vercel deployment not found. Please set 'APP_URL' in GitHub Secrets (Repository Settings -> Secrets and variables -> Actions) to your live Vercel URL (e.g., https://your-app.vercel.app)."
            fi
            exit 1
          fi

