version: '3.8'

services:
  # 1. Trade Oracle Trading Engine & Dashboard
  trade-oracle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-oracle-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://oracle_user:oracle_password@postgres:5432/trade_oracle?sslmode=disable}
      - PRISMA_CLIENT_ENGINE_TYPE=library
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - CRON_SECRET=${CRON_SECRET:-c4baf1f0f9d91c4e4ddb51e10fd15ba5327196c47c5555905f728c32ebfd3804}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  # 2. Self-Hosted PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: trade-oracle-db
    restart: always
    environment:
      POSTGRES_USER: oracle_user
      POSTGRES_PASSWORD: oracle_password
      POSTGRES_DB: trade_oracle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle_user -d trade_oracle"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Cloudflare Tunnel Sidecar (Provide CLOUDFLARE_TUNNEL_TOKEN in .env)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trade-oracle-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - trade-oracle

  # 4. Self-Contained 24/7 Autonomous Bot Cron Engine
  bot-cron:
    image: curlimages/curl:latest
    container_name: trade-oracle-cron
    restart: always
    command: >
      sh -c "while true; do
        echo '[SELF-HOSTED CRON] Executing Bot Tick...';
        curl -s -H 'Authorization: Bearer $${CRON_SECRET}' -H 'x-oracle-token: $${CRON_SECRET}' http://trade-oracle:3000/api/bot/tick;
        echo '';
        sleep 300;
      done"
    environment:
      - CRON_SECRET=${CRON_SECRET:-c4baf1f0f9d91c4e4ddb51e10fd15ba5327196c47c5555905f728c32ebfd3804}
    depends_on:
      - trade-oracle

volumes:
  postgres_data:

