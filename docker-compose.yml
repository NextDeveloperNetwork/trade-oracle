version: '3.8'

services:
  # 1. Trade Oracle Web Application & Execution Engine
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-oracle-app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - CRON_SECRET=${CRON_SECRET:-c4baf1f0f9d91c4e4ddb51e10fd15ba5327196c47c5555905f728c32ebfd3804}
      - APP_URL=${APP_URL:-https://tbo.dyqanmarket.com}
    networks:
      - oracle-network

  # 2. Cloudflare Zero Trust Tunnel Connector
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trade-oracle-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - oracle-network

  # 3. Autonomous 24/7 Bot Tick Engine (Internal Docker Cron)
  bot-cron:
    image: curlimages/curl:latest
    container_name: trade-oracle-cron
    restart: always
    command: >
      sh -c "while true; do
        echo '[SELF-HOSTED CRON] Executing Bot Tick...';
        curl -s -H 'Authorization: Bearer $${CRON_SECRET}' -H 'x-oracle-token: $${CRON_SECRET}' http://app:3000/api/bot/tick;
        echo '';
        sleep 300;
      done"
    environment:
      - CRON_SECRET=${CRON_SECRET:-c4baf1f0f9d91c4e4ddb51e10fd15ba5327196c47c5555905f728c32ebfd3804}
    depends_on:
      - app
    networks:
      - oracle-network

networks:
  oracle-network:
    driver: bridge


